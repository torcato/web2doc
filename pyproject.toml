[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "web2doc"
version = "0.1.0"
description = "Evidence-backed website workflow capture for user documentation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14,<2",
  "playwright>=1.59,<2",
  "pydantic>=2.10,<3",
  "pydantic-ai-slim[openai]>=2.42,<3",
  "pydantic-settings>=2.7,<3",
  "sqlalchemy>=2.0,<3",
  "typer>=0.15,<1",
]

[project.scripts]
web2doc = "web2doc.cli:app"

[dependency-groups]
test = [
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "hypothesis>=6.120,<7",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<2",
  "uvicorn>=0.34,<1",
]
lint = [
  "mypy>=1.14,<2",
  "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/web2doc"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "browser: requires an installed Playwright Chromium browser",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["web2doc"]
